name: Security and conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CCT_HYPOTHESIS_PROFILE: security-ci
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Run all tests and generate soundness table
        run: |
          rm -f docs/soundness-regression.md
          make ci
      - name: Publish regression table in job summary
        if: always()
        run: |
          if test -f docs/soundness-regression.md; then
            cat docs/soundness-regression.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve executed report and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-conformance-results
          path: |
            docs/soundness-regression.md
            test-results/junit.xml
          if-no-files-found: error
