[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cctbench"
version = "0.2.0"
description = "CCTBench: Reference Implementation and Benchmark for The Cognitive Continuity Test"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "rfc8785==0.1.4",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/openkedge/cctbench"
Repository = "https://github.com/openkedge/cctbench"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis==6.167.1",
]

[project.scripts]
cctbench = "cctbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["security: formal witness, replay, evidence, and semantic conformance properties"]
